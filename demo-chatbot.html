<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KI-Chatbot – WertFy Demo</title>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#C8A862;--bg:#050403;--card:rgba(255,255,255,.03);--text:#f0f0f0;--muted:rgba(240,240,240,.5);}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* Header */
.dh{display:flex;align-items:center;justify-content:space-between;padding:.85rem 2rem;border-bottom:1px solid rgba(200,168,98,.12);background:rgba(5,4,3,.98);backdrop-filter:blur(20px);flex-shrink:0;}
.dh-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.dh-name{font-family:'Instrument Serif',serif;font-size:1.2rem;color:#f0f0f0;}
.dh-name span{color:var(--gold);}
.dh-badge{font-size:.62rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);background:rgba(200,168,98,.08);border:1px solid rgba(200,168,98,.2);border-radius:999px;padding:.22rem .75rem;}
.dh-cta{background:var(--gold);color:#000;border:none;border-radius:999px;padding:.52rem 1.35rem;font-family:'Inter',sans-serif;font-weight:600;font-size:.8rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;transition:background .2s;}
.dh-cta:hover{background:#d4b870;}

/* Status bar */
.status-bar{background:rgba(200,168,98,.04);border-bottom:1px solid rgba(200,168,98,.07);padding:.55rem 2rem;display:flex;align-items:center;gap:1rem;flex-shrink:0;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.5);animation:lp 2.2s ease infinite;}
@keyframes lp{0%,100%{opacity:1;box-shadow:0 0 8px rgba(74,222,128,.5);}50%{opacity:.5;box-shadow:0 0 4px rgba(74,222,128,.2);}}
.status-text{font-size:.76rem;color:rgba(240,240,240,.45);}
.status-text strong{color:rgba(240,240,240,.75);font-weight:500;}
.status-right{margin-left:auto;font-size:.7rem;color:rgba(200,168,98,.4);letter-spacing:.05em;}

/* Chat layout */
.chat-wrap{flex:1;display:flex;flex-direction:column;max-width:780px;width:100%;margin:0 auto;padding:0 1.5rem;min-height:0;}
.chat-msgs{flex:1;overflow-y:auto;padding:1.5rem 0;display:flex;flex-direction:column;gap:1rem;}
.chat-msgs::-webkit-scrollbar{width:3px;}
.chat-msgs::-webkit-scrollbar-thumb{background:rgba(200,168,98,.15);border-radius:2px;}

/* Messages */
.msg-row{display:flex;gap:.7rem;align-items:flex-start;animation:msgIn .25s ease both;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.msg-row.user-row{flex-direction:row-reverse;}
.avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;}
.avatar.bot-av{background:rgba(200,168,98,.12);border:1px solid rgba(200,168,98,.3);color:var(--gold);font-family:'Instrument Serif',serif;font-size:.85rem;}
.avatar.user-av{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:rgba(240,240,240,.5);}
.msg-col{display:flex;flex-direction:column;gap:.3rem;}
.msg-col.right{align-items:flex-end;}
.bubble{max-width:480px;padding:.75rem 1.1rem;border-radius:.7rem;font-size:.875rem;line-height:1.65;}
.bubble.bot{background:rgba(255,255,255,.04);border:1px solid rgba(200,168,98,.1);color:rgba(240,240,240,.9);border-top-left-radius:.15rem;}
.bubble.user{background:rgba(200,168,98,.1);border:1px solid rgba(200,168,98,.22);color:#f0f0f0;border-top-right-radius:.15rem;}
.msg-time{font-size:.62rem;color:rgba(240,240,240,.22);}
.msg-tag{font-size:.6rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .55rem;border-radius:999px;display:inline-block;}
.tag-ok{background:rgba(74,222,128,.08);color:#4ade80;border:1px solid rgba(74,222,128,.2);}
.tag-info{background:rgba(200,168,98,.08);color:var(--gold);border:1px solid rgba(200,168,98,.2);}
.tag-esc{background:rgba(248,113,113,.08);color:#f87171;border:1px solid rgba(248,113,113,.2);}

/* Typing dots */
.typing-dots{display:flex;gap:4px;align-items:center;padding:.45rem .1rem;}
.td{width:7px;height:7px;border-radius:50%;background:rgba(200,168,98,.45);animation:tb .85s ease infinite;}
.td:nth-child(2){animation-delay:.2s;}
.td:nth-child(3){animation-delay:.4s;}
@keyframes tb{0%,80%,100%{transform:translateY(0);opacity:.45;}40%{transform:translateY(-6px);opacity:1;}}

/* Input area */
.input-area{padding:.75rem 0 1.2rem;border-top:1px solid rgba(200,168,98,.07);flex-shrink:0;}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.8rem;}
.chip{background:transparent;border:1px solid rgba(200,168,98,.22);border-radius:999px;padding:.38rem .95rem;font-size:.78rem;color:rgba(200,168,98,.8);cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;}
.chip:hover{background:rgba(200,168,98,.07);border-color:var(--gold);color:var(--gold);}
.input-row{display:flex;gap:.55rem;align-items:center;}
.msg-input{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(200,168,98,.14);border-radius:999px;padding:.65rem 1.2rem;color:#f0f0f0;font-family:'Inter',sans-serif;font-size:.875rem;outline:none;transition:border-color .2s;}
.msg-input::placeholder{color:rgba(240,240,240,.28);}
.msg-input:focus{border-color:rgba(200,168,98,.38);}
.send-btn{width:38px;height:38px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s,transform .15s;}
.send-btn:hover{background:#d4b870;transform:scale(1.06);}
.send-btn svg{width:15px;height:15px;stroke:#000;stroke-width:2.5;fill:none;}

/* WhatsApp card */
.wa-card{background:rgba(37,211,102,.06);border:1px solid rgba(37,211,102,.2);border-radius:.75rem;padding:1.1rem 1.25rem;margin-top:.25rem;max-width:420px;animation:msgIn .3s ease both;}
.wa-card-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem;}
.wa-icon{width:28px;height:28px;border-radius:50%;background:rgba(37,211,102,.15);border:1px solid rgba(37,211,102,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.wa-card-title{font-size:.82rem;font-weight:600;color:#f0f0f0;}
.wa-card-sub{font-size:.72rem;color:rgba(240,240,240,.45);margin-bottom:.85rem;line-height:1.55;}
.wa-problem{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:.45rem;padding:.6rem .85rem;font-size:.78rem;color:rgba(240,240,240,.6);margin-bottom:.85rem;line-height:1.5;font-style:italic;}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:.55rem;background:#25d366;color:#fff;border:none;border-radius:999px;padding:.65rem 1.5rem;font-family:'Inter',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer;width:100%;transition:background .2s,transform .15s;text-decoration:none;}
.wa-btn:hover{background:#1ebe5d;transform:translateY(-1px);}
.wa-response-time{text-align:center;margin-top:.55rem;font-size:.65rem;color:rgba(37,211,102,.55);}

/* WhatsApp chip – persistent */
.chip-wa{background:rgba(37,211,102,.07);border:1px solid rgba(37,211,102,.2);border-radius:999px;padding:.38rem .95rem;font-size:.78rem;color:rgba(37,211,102,.85);cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;}
.chip-wa:hover{background:rgba(37,211,102,.13);border-color:#25d366;color:#25d366;}

/* Persistent WhatsApp bar */
.wa-bar{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.55rem 0 0;border-top:1px solid rgba(37,211,102,.08);margin-top:.5rem;}
.wa-bar-btn{display:inline-flex;align-items:center;gap:.45rem;background:transparent;border:1px solid rgba(37,211,102,.2);border-radius:999px;padding:.38rem 1.1rem;font-size:.75rem;color:rgba(37,211,102,.7);cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
.wa-bar-btn:hover{background:rgba(37,211,102,.07);border-color:#25d366;color:#25d366;}
</style>
</head>

var chipsEl = document.getElementById('chips');

function ts(){return new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});}

function scrollBottom(){msgs.scrollTop = msgs.scrollHeight;}

function addUser(text){
  var r = document.createElement('div');
  r.className = 'msg-row user-row';
  r.innerHTML = '<div class="avatar user-av">Sie</div><div class="msg-col right"><div class="bubble user">'+escHtml(text)+'</div><div class="msg-time">'+ts()+'</div></div>';
  msgs.appendChild(r); scrollBottom();
}

function showTyping(){
  var r = document.createElement('div');
  r.className = 'msg-row'; r.id = 'typing';
  r.innerHTML = '<div class="avatar bot-av">W</div><div class="bubble bot"><div class="typing-dots"><div class="td"></div><div class="td"></div><div class="td"></div></div></div>';
  msgs.appendChild(r); scrollBottom();
}

function hideTyping(){var t=document.getElementById('typing');if(t)t.remove();}

function addBot(text, tag){
  var tagMap = {ok:'<span class="msg-tag tag-ok">Gelöst</span>',info:'<span class="msg-tag tag-info">Verarbeitet</span>',esc:'<span class="msg-tag tag-esc">Weitergeleitet</span>'};
  var r = document.createElement('div');
  r.className = 'msg-row';
  var bubble = document.createElement('div');
  bubble.className = 'bubble bot';
  var col = document.createElement('div');
  col.className = 'msg-col';
  col.appendChild(bubble);
  if(tag && tagMap[tag]) col.insertAdjacentHTML('beforeend', tagMap[tag]);
  var timeEl = document.createElement('div');
  timeEl.className = 'msg-time'; timeEl.textContent = ts();
  col.appendChild(timeEl);
  r.innerHTML = '<div class="avatar bot-av">W</div>';
  r.appendChild(col);
  msgs.appendChild(r); scrollBottom();
  streamText(bubble, text);
}

function streamText(el, text){
  var words = text.split(' ');
  var i = 0;
  function next(){
    if(i < words.length){
      el.innerHTML = words.slice(0,i+1).join(' ').replace(/\n/g,'<br>');
      i++; scrollBottom();
      setTimeout(next, 38 + Math.random()*22);
    }
  }
  next();
}

function escHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

    + '<span class="wa-card-title">Weiterleitung zu Maiana</span>'
    + '</div>'
    + '<div class="wa-card-sub">Alle Ihre Angaben werden strukturiert übermittelt – Maiana ist sofort im Bild.</div>'
    + '<div class="wa-problem">'
    + '<span style="color:rgba(240,240,240,.4);font-size:.68rem;display:block;margin-bottom:.3rem;">Ihre Zusammenfassung</span>'
    + '<b>' + escHtml(d.name||'') + '</b> · ' + escHtml(d.company||'') + ' · ' + escHtml(d.size||'') + '<br>'
    + '<span style="font-style:normal;color:rgba(240,240,240,.55);">' + escHtml(d.problem||'') + '</span>'
    + '</div>'
    + '<a class="wa-btn" href="' + link + '" target="_blank">'
    + WA_SVG + ' Jetzt WhatsApp öffnen'
    + '</a>'
    + '<div class="wa-response-time">Ø Antwortzeit unter 5 Minuten · Mo – Sa</div>';
  row.innerHTML = '<div class="avatar bot-av">W</div>';
  row.appendChild(card);
  msgs.appendChild(row);
  scrollBottom();
}

function askCollect(question, nextState, placeholder){
  collectState = nextState;
  inp.placeholder = placeholder || 'Ihre Antwort …';
  inp.focus();
  showTyping();
  setTimeout(function(){
    hideTyping();
    addBot(question, null);
    busy = false;
  }, 800);
}

function startCollect(){
  if(collectState) return;
  busy = true;
  chipsEl.innerHTML = '';
  addUser('Ich möchte direkt mit einer Mitarbeiterin sprechen.');
  collected = {};
  setTimeout(function(){
    showTyping();
    setTimeout(function(){
      hideTyping();
      addBot('Sehr gerne! Damit Maiana Ihre Anfrage optimal vorbereiten kann, benötige ich noch 4 kurze Angaben von Ihnen.\n\nDas dauert weniger als eine Minute.', null);
      setTimeout(function(){
        askCollect('Wie ist Ihr vollständiger Name?', 'name', 'Vor- und Nachname …');
      }, 900);
    }, 1000);
  }, 150);
}

function handleCollect(text){
  if(!text.trim()) return;
  inp.value = '';
  inp.placeholder = 'Ihre Antwort …';

  if(collectState === 'name'){
    collected.name = text;
    addUser(text);
    askCollect('Für welches Unternehmen arbeiten Sie?', 'company', 'Unternehmensname …');

  } else if(collectState === 'company'){
    collected.company = text;
    addUser(text);
    collectState = 'size';
    busy = true;
    showTyping();
    setTimeout(function(){
      hideTyping();
      addBot('Wie viele Mitarbeitende hat Ihr Unternehmen?', null);
      // Show size chips
      chipsEl.innerHTML = '';
      ['1–5 Personen','6–19 Personen','20–49 Personen','50+ Personen'].forEach(function(s){
        var b = document.createElement('button');
        b.className = 'chip'; b.textContent = s;
        b.onclick = function(){
          if(collectState !== 'size') return;
          collected.size = s;
          chipsEl.innerHTML = '';
          addUser(s);
          askCollect('Beschreiben Sie kurz Ihr Anliegen – was soll WertFy für Sie lösen?', 'problem', 'Mein Anliegen ist …');
        };
        chipsEl.appendChild(b);
      });
      busy = false;
    }, 800);

  } else if(collectState === 'problem'){
    collected.problem = text;
    addUser(text);
    collectState = null;
    inp.placeholder = 'Ihre Nachricht …';
    busy = true;
    chipsEl.innerHTML = '';
    showTyping();
    setTimeout(function(){
      hideTyping();
      addBot('Vielen Dank! Ich habe alle Angaben erfasst.\n\nIch öffne jetzt WhatsApp – Ihre Daten werden strukturiert an Maiana übermittelt. Sie müssen nur noch auf Senden drücken.', 'ok');
      setTimeout(function(){
        addWACard(collected);
        setChips(['Weitere Frage','Zurück']);
        busy = false;
      }, 900);
    }, 800);
  }
}

function setChips(list){
  chipsEl.innerHTML = '';
  list.forEach(function(c){
    var b = document.createElement('button');
    b.className = 'chip'; b.textContent = c;
    b.onclick = function(){if(!busy && !collectState) handle(c);};
    chipsEl.appendChild(b);
  });
  var wa = document.createElement('button');
  wa.className = 'chip-wa'; wa.textContent = 'Mitarbeiterin verbinden';
  wa.onclick = function(){if(!busy && !collectState) startCollect();};
  chipsEl.appendChild(wa);
}

function handle(text){
  if(!text.trim() || busy || collectState) return;
  busy = true;
  inp.value = '';
  chipsEl.innerHTML = '';
  addUser(text);
  var isKnown = !!flows[text];
  if(!isKnown) userMessages.push(text);
  setTimeout(function(){
    showTyping();
    var delay = 900 + Math.random()*700;
    setTimeout(function(){
      hideTyping();
      var f = flows[text];
      if(!f){
        addBot('Ich habe Ihr Anliegen notiert.\n\nFür eine persönliche Beratung verbinde ich Sie direkt mit Maiana – ich sammle dafür kurz Ihre Kontaktdaten.', null);
        setTimeout(function(){
          collected = { problem: text };
          askCollect('Wie ist Ihr vollständiger Name?', 'name', 'Vor- und Nachname …');
        }, 900);
        return;
      }
      addBot(f.bot, f.tag);
      setTimeout(function(){setChips(f.chips); busy = false;}, 700);
    }, delay);
  }, 150);
}

function submit(){
  if(collectState) { handleCollect(inp.value); }
  else { handle(inp.value); }
}

// WhatsApp bar button → starts collection wizard
document.getElementById('waBarBtn').onclick = function(){
  if(!busy && !collectState) startCollect();
};

document.getElementById('sendBtn').onclick = submit;
inp.onkeydown = function(e){if(e.key==='Enter') submit();};

// Initial greeting
setTimeout(function(){
  showTyping();
  setTimeout(function(){
    hideTyping();
    addBot(flows.start.bot, flows.start.tag);
    setTimeout(function(){setChips(flows.start.chips);}, 900);
  }, 1100);
}, 600);
</script>
</body>
</html>
