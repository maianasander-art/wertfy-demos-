<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Mail-Automatisierung – WertFy Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#C8A862;--bg:#050403;}
body{background:var(--bg);color:#f0f0f0;font-family:'Inter',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

.dh{display:flex;align-items:center;justify-content:space-between;padding:.85rem 2rem;border-bottom:1px solid rgba(200,168,98,.12);background:rgba(5,4,3,.98);flex-shrink:0;z-index:10;}
.dh-logo{display:flex;align-items:center;gap:10px;}
.dh-name{font-family:'Instrument Serif',serif;font-size:1.2rem;color:#f0f0f0;}
.dh-name span{color:var(--gold);}
.dh-badge{font-size:.62rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);background:rgba(200,168,98,.08);border:1px solid rgba(200,168,98,.2);border-radius:999px;padding:.22rem .75rem;}
.dh-cta{background:var(--gold);color:#000;border:none;border-radius:999px;padding:.52rem 1.35rem;font-family:'Inter',sans-serif;font-weight:600;font-size:.8rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;transition:background .2s;}
.dh-cta:hover{background:#d4b870;}

/* Three-pane layout */
.app{flex:1;display:grid;grid-template-columns:280px 1fr 320px;min-height:0;}

/* Inbox sidebar */
.inbox{border-right:1px solid rgba(200,168,98,.08);overflow-y:auto;background:rgba(255,255,255,.01);}
.inbox::-webkit-scrollbar{width:3px;}
.inbox::-webkit-scrollbar-thumb{background:rgba(200,168,98,.1);border-radius:2px;}
.inbox-hd{padding:1rem 1.25rem;border-bottom:1px solid rgba(200,168,98,.07);display:flex;align-items:center;justify-content:space-between;}
.inbox-title{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(240,240,240,.35);}
.inbox-count{font-size:.65rem;background:rgba(200,168,98,.12);color:var(--gold);border-radius:999px;padding:.1rem .5rem;font-weight:600;}

.mail-item{padding:.9rem 1.25rem;border-bottom:1px solid rgba(200,168,98,.05);cursor:pointer;transition:background .18s;position:relative;}
.mail-item:hover{background:rgba(200,168,98,.04);}
.mail-item.active{background:rgba(200,168,98,.07);border-right:2px solid var(--gold);}
.mail-item.unread .mail-sender{font-weight:600;color:#f0f0f0;}
.mail-sender{font-size:.82rem;color:rgba(240,240,240,.75);margin-bottom:.2rem;display:flex;align-items:center;justify-content:space-between;}
.mail-time{font-size:.65rem;color:rgba(240,240,240,.3);font-weight:400;}
.mail-subject{font-size:.78rem;color:rgba(240,240,240,.55);margin-bottom:.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mail-preview{font-size:.72rem;color:rgba(240,240,240,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mail-tags{display:flex;gap:.3rem;margin-top:.4rem;flex-wrap:wrap;}
.m-tag{font-size:.58rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:.12rem .45rem;border-radius:999px;}
.mt-anfrage{background:rgba(96,165,250,.08);color:#60a5fa;border:1px solid rgba(96,165,250,.15);}
.mt-beschwerde{background:rgba(248,113,113,.08);color:#f87171;border:1px solid rgba(248,113,113,.15);}
.mt-angebot{background:rgba(200,168,98,.08);color:var(--gold);border:1px solid rgba(200,168,98,.15);}
.mt-intern{background:rgba(74,222,128,.08);color:#4ade80;border:1px solid rgba(74,222,128,.15);}
.mt-support{background:rgba(251,146,60,.08);color:#fb923c;border:1px solid rgba(251,146,60,.15);}
.unread-dot{position:absolute;right:.85rem;top:1.1rem;width:7px;height:7px;border-radius:50%;background:var(--gold);}

/* Email content */
.email-content{padding:1.75rem 2rem;overflow-y:auto;border-right:1px solid rgba(200,168,98,.08);}
.email-content::-webkit-scrollbar{width:3px;}
.email-content::-webkit-scrollbar-thumb{background:rgba(200,168,98,.1);border-radius:2px;}
.email-placeholder{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.75rem;color:rgba(240,240,240,.2);}
.email-ph-icon{width:48px;height:48px;border-radius:50%;background:rgba(200,168,98,.05);border:1px solid rgba(200,168,98,.1);display:flex;align-items:center;justify-content:center;}
.email-ph-text{font-size:.85rem;}
.email-from{font-size:.72rem;color:rgba(240,240,240,.35);margin-bottom:1.25rem;line-height:1.6;}
.email-from strong{color:rgba(240,240,240,.7);font-weight:500;}
.email-subject-line{font-family:'Instrument Serif',serif;font-size:1.35rem;color:#f0f0f0;margin-bottom:1.25rem;line-height:1.3;}
.email-body{font-size:.85rem;color:rgba(240,240,240,.65);line-height:1.8;}
.email-divider{height:1px;background:rgba(200,168,98,.07);margin:1.5rem 0;}
.email-actions{display:flex;gap:.6rem;flex-wrap:wrap;}
.action-btn{background:rgba(255,255,255,.04);border:1px solid rgba(200,168,98,.12);border-radius:999px;padding:.42rem 1rem;font-size:.75rem;color:rgba(240,240,240,.5);cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
.action-btn:hover{border-color:rgba(200,168,98,.3);color:rgba(240,240,240,.8);}
.action-btn.primary{background:var(--gold);border-color:var(--gold);color:#000;font-weight:600;}
.action-btn.primary:hover{background:#d4b870;}

/* AI panel */
.ai-panel{overflow-y:auto;background:rgba(200,168,98,.02);}
.ai-panel::-webkit-scrollbar{width:3px;}
.ai-panel::-webkit-scrollbar-thumb{background:rgba(200,168,98,.1);border-radius:2px;}
.ai-hd{padding:1rem 1.25rem;border-bottom:1px solid rgba(200,168,98,.07);}
.ai-hd-title{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(240,240,240,.35);margin-bottom:.15rem;}
.ai-hd-sub{font-size:.68rem;color:rgba(200,168,98,.45);}
.ai-section{padding:1rem 1.25rem;border-bottom:1px solid rgba(200,168,98,.06);}
.ai-sec-title{font-size:.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(240,240,240,.3);margin-bottom:.65rem;}
.ai-metric{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;}
.ai-metric-label{font-size:.78rem;color:rgba(240,240,240,.5);}
.ai-metric-val{font-size:.78rem;font-weight:600;}
.conf-bar{height:3px;border-radius:2px;background:rgba(200,168,98,.1);margin-top:.25rem;overflow:hidden;}
.conf-fill{height:100%;border-radius:2px;transition:width .6s ease;}
.prio-bar{display:flex;gap:3px;margin-top:.5rem;}
.prio-seg{flex:1;height:5px;border-radius:2px;background:rgba(255,255,255,.06);}
.prio-seg.filled{background:var(--gold);}
.prio-seg.filled.red{background:#f87171;}

.ai-reply{padding:1.1rem 1.25rem;}
.ai-reply-label{font-size:.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(240,240,240,.3);margin-bottom:.75rem;}
.reply-box{background:rgba(255,255,255,.03);border:1px solid rgba(200,168,98,.1);border-radius:.6rem;padding:1rem;font-size:.78rem;color:rgba(240,240,240,.7);line-height:1.7;min-height:120px;}
.reply-actions{display:flex;gap:.5rem;margin-top:.75rem;}
.ra-btn{border:none;border-radius:999px;padding:.42rem 1rem;font-size:.75rem;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
.ra-primary{background:var(--gold);color:#000;font-weight:600;}
.ra-primary:hover{background:#d4b870;}
.ra-ghost{background:transparent;border:1px solid rgba(200,168,98,.15);color:rgba(240,240,240,.4);}
.ra-ghost:hover{border-color:rgba(200,168,98,.3);color:rgba(240,240,240,.65);}

.ai-empty{padding:2rem 1.25rem;text-align:center;color:rgba(240,240,240,.2);font-size:.8rem;}

/* ── Mobile CSS ── */
/* Mobile inbox toggle button – hidden on desktop */
.inbox-toggle{display:none;position:fixed;bottom:1.25rem;left:1.25rem;z-index:200;background:var(--gold);color:#000;border:none;border-radius:999px;padding:.6rem 1.1rem;font-family:'Inter',sans-serif;font-weight:700;font-size:.8rem;cursor:pointer;box-shadow:0 4px 16px rgba(200,168,98,.35);align-items:center;gap:.4rem;}

@media(max-width:768px){
  /* Body: allow scrolling on mobile */
  body{height:auto;overflow:auto;}

  /* Show the inbox toggle button */
  .inbox-toggle{display:inline-flex;}

  /* Switch to single-column stacked layout */
  .app{grid-template-columns:1fr;height:auto;display:flex;flex-direction:column;}

  /* Header */
  .dh{padding:.7rem 1rem;flex-wrap:wrap;gap:.5rem;}
  .dh-logo{flex:1;min-width:0;}
  .dh-name{font-size:1rem;}
  .dh-badge{display:none;}
  .dh-cta{font-size:.75rem;padding:.48rem 1rem;white-space:nowrap;}

  /* Inbox sidebar: hidden by default on mobile, slides in as overlay */
  .inbox{
    position:fixed;top:0;left:0;bottom:0;
    width:85vw;max-width:320px;
    z-index:150;
    overflow-y:auto;
    background:#050403;
    border-right:1px solid rgba(200,168,98,.15);
    transform:translateX(-100%);
    transition:transform .28s ease;
  }
  .inbox.open{transform:translateX(0);}

  /* Overlay behind open inbox */
  .inbox-backdrop{display:none;position:fixed;inset:0;z-index:140;background:rgba(0,0,0,.6);}
  .inbox-backdrop.open{display:block;}

  /* Email content: full width, scrollable, min height */
  .email-content{border-right:none;border-bottom:1px solid rgba(200,168,98,.08);padding:1.25rem 1rem;min-height:260px;}
  .email-subject-line{font-size:1.1rem;}
  .email-actions{gap:.4rem;}
  .action-btn{font-size:.75rem;padding:.5rem .85rem;min-height:40px;}
  .action-btn.primary{min-height:44px;}

  /* AI panel: full width below email */
  .ai-panel{overflow-y:visible;}
  .ai-reply,.ai-section{padding:.85rem 1rem;}
  .reply-box{font-size:.82rem;min-height:100px;}
  .ra-btn{min-height:40px;font-size:.78rem;}
  .ra-primary{min-height:44px;}
  .reply-actions{flex-wrap:wrap;}

  /* Mail list items: bigger tap targets */
  .mail-item{padding:.85rem 1rem;min-height:60px;}
  .mail-sender{font-size:.85rem;}
}

@media(max-width:480px){
  .dh{padding:.6rem .75rem;}
  .email-content{padding:1rem .75rem;}
  .ai-section,.ai-reply{padding:.75rem .85rem;}
  .email-subject-line{font-size:1rem;}
  .email-body{font-size:.82rem;}
  .action-btn{font-size:.72rem;padding:.45rem .7rem;}
  .inbox-toggle{bottom:1rem;left:1rem;font-size:.75rem;padding:.55rem .9rem;}
}
</style>
</head>

<script>
// Mobile inbox toggle
(function(){
  var toggle = document.getElementById('inboxToggle');
  var sidebar = document.getElementById('inboxSidebar');
  var backdrop = document.getElementById('inboxBackdrop');
  if(toggle && sidebar && backdrop){
    toggle.addEventListener('click', function(){
      sidebar.classList.toggle('open');
      backdrop.classList.toggle('open');
    });
    backdrop.addEventListener('click', function(){
      sidebar.classList.remove('open');
      backdrop.classList.remove('open');
    });
    // Close sidebar after selecting a mail on mobile
    document.addEventListener('click', function(e){
      if(e.target.closest('.mail-item') && window.innerWidth <= 768){
        sidebar.classList.remove('open');
        backdrop.classList.remove('open');
      }
    });
  }
})();

var tagClsMap = {anfrage:'mt-anfrage',beschwerde:'mt-beschwerde',angebot:'mt-angebot',intern:'mt-intern',support:'mt-support'};

// Build mail list
var list = document.getElementById('mailList');
emails.forEach(function(e){
  var item = document.createElement('div');
  item.className = 'mail-item' + (e.unread?' unread':'');
  item.innerHTML = '<div class="mail-sender"><span>'+e.sender+'</span><span class="mail-time">'+e.time+'</span></div>'

    + '<div class="mail-preview">'+e.preview+'</div>'

    + (e.unread?'<div class="unread-dot"></div>':'');
  item.onclick = function(){
    document.querySelectorAll('.mail-item').forEach(function(m){m.classList.remove('active');});
    item.classList.remove('unread');
    item.querySelector('.unread-dot') && item.querySelector('.unread-dot').remove();
    item.classList.add('active');
    showEmail(e);
  };
  list.appendChild(item);
});

function showEmail(e){
  var pane = document.getElementById('emailPane');
  pane.innerHTML = '<div class="email-from">'
    + '<strong>Von:</strong> '+e.sender+' &lt;'+e.email+'&gt;<br>'
    + '<strong>Betreff:</strong> '+e.subject+'<br>'
    + '<strong>Datum:</strong> '+e.time+'</div>'
    + '<div class="email-subject-line">'+e.subject+'</div>'
    + '<div class="email-body">'+e.body.replace(/\n/g,'<br>')+'</div>'
    + '<div class="email-divider"></div>'
    + '<div class="email-actions">'
    + '<button class="action-btn primary">Antworten</button>'
    + '<button class="action-btn">Weiterleiten</button>'
    + '<button class="action-btn">Archivieren</button>'
    + '<button class="action-btn">Markierung entfernen</button>'
    + '</div>';

  showAI(e);
}

function showAI(e){
  var pane = document.getElementById('aiPane');
  var prioSegs = '';
  for(var i=1;i<=5;i++){
    prioSegs += '<div class="prio-seg'+(i<=e.prio?' filled'+(e.prio>=4?' red':''):'')+'"></div>';
  }
  var prioLabel = ['','Sehr niedrig','Niedrig','Mittel','Hoch','Kritisch'][e.prio];

  pane.innerHTML = '<div class="ai-hd"><div class="ai-hd-title">KI-Analyse</div><div class="ai-hd-sub">Powered by WertFy AI</div></div>'
    + '<div class="ai-section">'
    + '<div class="ai-sec-title">Klassifizierung</div>'
    + '<div class="ai-metric"><span class="ai-metric-label">Kategorie</span><span class="ai-metric-val" style="color:var(--gold);">'+e.cat+'</span></div>'
    + '<div class="conf-bar"><div class="conf-fill" style="width:94%;background:var(--gold);"></div></div>'
    + '<div style="font-size:.62rem;color:rgba(200,168,98,.4);margin-top:.2rem;">Konfidenz 94%</div>'
    + '</div>'
    + '<div class="ai-section">'
    + '<div class="ai-sec-title">Stimmungsanalyse</div>'
    + '<div class="ai-metric"><span class="ai-metric-label">Sentiment</span><span class="ai-metric-val" style="color:'+e.sentCls+';">'+e.sentiment+'</span></div>'
    + '</div>'
    + '<div class="ai-section">'
    + '<div class="ai-sec-title">Priorität</div>'
    + '<div class="ai-metric"><span class="ai-metric-label">Stufe</span><span class="ai-metric-val" style="color:'+(e.prio>=4?'#f87171':'var(--gold)')+';">'+prioLabel+'</span></div>'
    + '<div class="prio-bar">'+prioSegs+'</div>'
    + '</div>'
    + '<div class="ai-reply">'
    + '<div class="ai-reply-label">KI-Antwortvorschlag</div>'
    + '<div class="reply-box" id="replyBox"></div>'
    + '<div class="reply-actions">'
    + '<button class="ra-btn ra-primary">Antwort übernehmen</button>'
    + '<button class="ra-btn ra-ghost">Bearbeiten</button>'
    + '</div>'
    + '</div>';

  streamReply(e.reply);
}

function streamReply(text){
  var box = document.getElementById('replyBox');
  box.innerHTML = '';
  var words = text.split(' ');
  var i = 0;
  function next(){
    if(i < words.length){
      box.innerHTML = words.slice(0,i+1).join(' ').replace(/\n/g,'<br>');
      i++;
      setTimeout(next, 28 + Math.random()*15);
    }
  }
  setTimeout(next, 400);
}
</script>
</body>
</html>
